<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Betting Tracker</title>
<style>
  :root { --bg:#0f1117; --card:#181b23; --line:#262a35; --text:#e8eaf0; --dim:#8a90a0; --green:#3ecf8e; --red:#f0616d; --amber:#e8b34b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:20px; max-width:900px; margin:0 auto; }
  h1 { font-size:19px; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .stat .v { font-size:21px; font-weight:650; margin-top:2px; }
  .pos { color:var(--green); } .neg { color:var(--red); } .warn { color:var(--amber); }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--green); border-radius:3px; }
  .bar i.hot { background:var(--amber); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:20px 0 8px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13.5px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:600; }
  .pill.won { background:rgba(62,207,142,.15); color:var(--green); }
  .pill.lost { background:rgba(240,97,109,.15); color:var(--red); }
  .pill.pending { background:rgba(232,179,75,.15); color:var(--amber); }
  .pill.cashed_out, .pill.void { background:rgba(138,144,160,.15); color:var(--dim); }
  .note { color:var(--dim); font-size:12px; margin-top:14px; }
  #err { color:var(--red); padding:14px; display:none; }
  @media (max-width:560px){ .hide-m { display:none; } body { padding:12px; } }
</style>
</head>
<body>
<h1>Betting Tracker</h1>
<div class="sub" id="updated">Loading…</div>
<div id="err"></div>
<div class="grid" id="stats"></div>
<h2>Open exposure</h2>
<div class="stat">
  <div class="k">Open staked vs £50 cap</div>
  <div class="v" id="expo">–</div>
  <div class="bar"><i id="expobar" style="width:0"></i></div>
</div>
<h2>Pending bets</h2>
<table id="pending"><thead><tr>
  <th>ID</th><th>Player / Market</th><th class="hide-m">Platform</th><th class="num">Odds</th><th class="num">Stake</th>
</tr></thead><tbody></tbody></table>
<h2>Last 10 settled</h2>
<table id="settled"><thead><tr>
  <th>ID</th><th>Player / Market</th><th class="hide-m">Date</th><th>Result</th><th class="num">Net P&L</th>
</tr></thead><tbody></tbody></table>
<div class="note" id="kv"></div>
<div class="note">Figures come from pl.json / active.json only — this page is read-only presentation (Rule 49). Refresh after each logged session.</div>

<script>
const gbp = n => (n < 0 ? "-£" : "£") + Math.abs(n).toFixed(2);
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";

async function load() {
  try {
    const bust = "?t=" + Date.now();
    const [pl, active] = await Promise.all([
      fetch("pl.json" + bust).then(r => { if (!r.ok) throw new Error("pl.json " + r.status); return r.json(); }),
      fetch("active.json" + bust).then(r => { if (!r.ok) throw new Error("active.json " + r.status); return r.json(); })
    ]);
    const bets = Array.isArray(active) ? active : (active.bets || []);

    document.getElementById("updated").textContent =
      "Last updated " + pl.updated + " · " + pl.total + " bets all-time";

    const stats = [
      ["Running P&L", gbp(pl.pnl), cls(pl.pnl)],
      ["Cash P&L", gbp(pl.cash_pnl), cls(pl.cash_pnl)],
      ["ROI (blended)", pl.roi.toFixed(1) + "%", cls(pl.roi)],
      ["ROI (cash)", pl.cash_roi.toFixed(1) + "%", cls(pl.cash_roi)],
      ["Record", pl.won + "W – " + pl.lost + "L", ""],
      ["Win rate", pl.win_rate.toFixed(1) + "%", ""],
      ["Total staked", gbp(pl.staked), ""],
      ["Best return", gbp(pl.best_return), "pos"]
    ];
    document.getElementById("stats").innerHTML = stats.map(([k, v, c]) =>
      `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join("");

    // Exposure: prefer stored open_staked, fall back to computing from pending
    const pending = bets.filter(b => b.result === "pending");
    const open = (typeof pl.open_staked === "number") ? pl.open_staked
               : pending.reduce((s, b) => s + (+b.stake || 0), 0);
    const pct = Math.min(100, open / 50 * 100);
    document.getElementById("expo").textContent = gbp(open) + " / £50.00";
    document.getElementById("expo").className = "v " + (open > 50 ? "neg" : open >= 40 ? "warn" : "");
    const bar = document.getElementById("expobar");
    bar.style.width = pct + "%";
    if (open >= 40) bar.className = "hot";

    document.querySelector("#pending tbody").innerHTML = pending.length ? pending.map(b => `
      <tr><td>${b.id}</td><td>${b.player || "–"}<span style="color:var(--dim)"> · ${b.market || ""}</span></td>
      <td class="hide-m">${b.platform || "–"}</td>
      <td class="num">${b.odds ?? "–"}</td><td class="num">${gbp(+b.stake || 0)}</td></tr>`).join("")
      : `<tr><td colspan="5" style="color:var(--dim)">No pending bets</td></tr>`;

    const settled = bets.filter(b => b.result !== "pending")
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (+b.id > +a.id ? 1 : -1))
      .slice(0, 10);
    document.querySelector("#settled tbody").innerHTML = settled.map(b => `
      <tr><td>${b.id}</td><td>${b.player || "–"}<span style="color:var(--dim)"> · ${b.market || ""}</span></td>
      <td class="hide-m">${b.date || "–"}</td>
      <td><span class="pill ${b.result}">${(b.result || "").replace("_", " ")}</span></td>
      <td class="num ${cls(+b.net_pl || 0)}">${gbp(+b.net_pl || 0)}</td></tr>`).join("");

    if (pl.known_variance && pl.known_variance.delta) {
      const d = pl.known_variance.delta;
      document.getElementById("kv").textContent =
        `Known variance (records vs aggregates, noted ${pl.known_variance.noted}): ` +
        `total ${d.total}, won ${d.won}, lost ${d.lost}, P&L £${d.pnl.toFixed(2)}, staked £${d.staked.toFixed(2)}. Aggregates are canonical.`;
    }
  } catch (e) {
    const el = document.getElementById("err");
    el.style.display = "block";
    el.textContent = "Failed to load data: " + e.message;
    document.getElementById("updated").textContent = "";
  }
}
load();
</script>
</body>
</html>
